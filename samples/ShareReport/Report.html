<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NodeNix · Endpoint console</title><style>
:root{--bg:#0b1018;--panel:#121b28;--line:#263246;--muted:#95a5bb;--text:#e6edf7;--mint:#64e3c1;--warn:#f6c96c;--red:#ff8e97}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}aside{padding:30px 22px;border-right:1px solid var(--line);background:#0e1520}.brand{font-size:26px;font-weight:800;letter-spacing:-1px}.logo{color:var(--mint)}.small{font-size:12px;color:var(--muted)}nav{margin-top:40px;display:grid;gap:8px}nav button{border:0;background:none;color:var(--muted);text-align:left;padding:12px 14px;border-radius:8px}nav button.active{color:var(--mint);background:#19332f}main{padding:35px 42px;max-width:1550px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--mint)}h1{font-size:30px;letter-spacing:-1px;margin:5px 0}h2{font-size:18px;margin:0 0 18px}h3{margin:0 0 8px;font-size:16px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);border-radius:8px;padding:9px 16px;background:var(--panel);color:var(--text)}.primary{background:var(--mint);color:#10221e;border:0;font-weight:700}.banner{border:1px solid #365543;color:#b5dec9;background:#13291f;padding:10px 16px;margin:24px 0;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.box{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:22px}.number{font-size:32px;font-weight:750;margin-top:9px}.unit{font-size:13px;color:var(--muted)}.bar{height:4px;background:#273547;margin-top:12px;border-radius:4px}.fill{height:100%;background:var(--mint);border-radius:4px}.split{display:grid;grid-template-columns:1.8fr 1fr;gap:20px;margin-top:24px}.finding{padding:17px 0;border-bottom:1px solid var(--line)}.finding:last-child{border:0}.badge{font-size:10px;text-transform:uppercase;letter-spacing:1px;border-radius:4px;padding:3px 6px;display:inline-block;background:#263246;color:var(--muted)}.critical{color:var(--red);background:#42232e}.warning{color:var(--warn);background:#3c3222}.info{color:#99c1ff;background:#21324c}.finding h3{margin-top:7px}.finding p{margin:6px 0;font-size:13px}.statrow{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--line)}.good{color:var(--mint)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:22px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;max-height:450px;overflow:auto;background:#0b111b;padding:18px;border-radius:8px}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}input,select,textarea{background:#0b111b;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:10px}input{min-width:230px}textarea{width:100%;min-height:110px}label{display:block;margin:15px 0 6px;color:var(--muted);font-size:13px}ol{padding-left:24px}li{padding:9px 0}code{color:var(--mint);overflow-wrap:anywhere}.empty{padding:25px;color:var(--muted)}.footer{margin-top:30px;font-size:12px;color:var(--muted)}.view{display:none}.view.active{display:block}a{color:var(--mint)}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:700px){.shell{grid-template-columns:1fr}aside{padding:15px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{padding:22px 16px}.grid{grid-template-columns:1fr}h1{font-size:25px}}@media print{aside,.toolbar,.btn,.banner{display:none}.shell{display:block}body{background:white;color:black}.card,.box{background:white;border-color:#aaa}main{padding:0;max-width:none}.muted,.small{color:#555}pre{color:black;background:#eee;max-height:none}.view.active{display:block}}
</style></head><body><div class="shell"><aside><div class="brand"><span class="logo">◈</span> NodeNix</div><div class="small">DIAGNOSE · RESOLVE · VERIFY</div><nav aria-label="Console pages" id="nav"></nav><div style="margin-top:40px" class="small">LOCAL ENDPOINT TOOLKIT<br>Version 0.1.2<br><br>No cloud connection<br>No automatic repairs</div></aside><main><div class="top"><div><div class="eyebrow">Endpoint operations</div><h1 id="title">Device overview</h1><div class="muted" id="subtitle"></div></div><div><button class="btn" id="json">Export scan JSON</button> <button class="btn primary" onclick="window.print()">Print / PDF</button></div></div><div id="banner" class="banner"></div><div id="overview" class="view active"></div><div id="findings" class="view"></div><div id="evidence" class="view"></div><div id="troubleshoot" class="view"></div><div id="ticket" class="view"></div><div id="repairs" class="view"></div><div class="footer">NodeNix · Point-in-time evidence, not a compliance certificate or malware verdict. Review exports before sharing.</div></main></div>
<script id="payload" type="application/json">{"scan": {"schema_version": 1, "version": "0.1.2", "mode": "demo", "generated_at": "2026-10-03T15:30:00Z", "elevated": false, "privacy": "share", "sections": {"system": {"status": "ok", "data": {"os": "Windows 11 Pro", "build": "26100", "uptime_days": 18.4, "memory_percent": 88.6, "ram_gb": 16, "manufacturer": "Demo Systems", "model": "Lab workstation"}}, "hardware": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "storage": {"status": "ok", "data": [{"drive": "C:", "size_gb": 953.8, "free_gb": 31.4, "used_percent": 96.7, "filesystem": "NTFS"}, {"drive": "D:", "size_gb": 953.8, "free_gb": 622.4, "used_percent": 34.7, "filesystem": "NTFS"}]}, "physical_disks": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "network": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "connectivity": {"status": "ok", "data": {"tested": true, "gateway": true, "internet_icmp": true, "dns": false, "https": false, "target": "www.microsoft.com"}}, "services": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "processes": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "printers": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "events": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "updates": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "defender": {"status": "ok", "data": {"AntivirusEnabled": true, "RealTimeProtectionEnabled": true, "AntivirusSignatureAge": 1, "AMServiceEnabled": true}}, "firewall": {"status": "ok", "data": [{"Name": "Domain", "Enabled": true}, {"Name": "Private", "Enabled": true}, {"Name": "Public", "Enabled": true}]}, "bitlocker": {"status": "unavailable", "data": null, "error": "Collection unavailable; details omitted."}, "secure_boot": {"status": "ok", "data": {"enabled": true}}, "tpm": {"status": "ok", "data": {"TpmPresent": true, "TpmReady": true}}, "accounts": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "software": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "startup": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "connections": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}, "drivers": {"status": "omitted", "data": null, "reason": "Excluded from share profile."}}}, "findings": [{"code": "DISK_SPACE", "severity": "critical", "category": "Storage", "title": "Low free space on C:", "evidence": "96.7% used; 31.4 GB free.", "next_step": "Review large files and approved cleanup options. Do not delete user data without approval."}, {"code": "MEMORY_HIGH", "severity": "warning", "category": "System", "title": "High memory utilization", "evidence": "88.6% used at collection time.", "next_step": "Review top memory consumers and reproduce the slowdown; one sample does not establish a trend."}, {"code": "DNS_FAILED", "severity": "warning", "category": "Network", "title": "DNS probe failed", "evidence": "www.microsoft.com could not be resolved during this scan.", "next_step": "Inspect configured DNS, VPN and resolver reachability; flush the cache only if appropriate, then retest."}, {"code": "HTTPS_FAILED", "severity": "warning", "category": "Network", "title": "HTTPS probe failed", "evidence": "HEAD request to www.microsoft.com did not succeed.", "next_step": "Check proxy, captive portal, TLS inspection, DNS and site availability. A single target failure does not prove an Internet outage."}, {"code": "UPTIME_LONG", "severity": "info", "category": "System", "title": "Extended uptime", "evidence": "18.4 days since boot.", "next_step": "Consider an agreed restart if troubleshooting requires it; uptime alone is not a fault."}], "workflows": {"No Internet": {"sections": ["network", "connectivity"], "steps": ["Inspect adapter addresses, gateway and DNS; check for APIPA (169.254.x.x).", "Compare gateway ICMP, DNS and HTTPS probes; an ICMP failure alone is inconclusive.", "Check VPN, proxy and captive portal. Use approved network settings.", "Apply an approved action, then run another scan with connectivity probes.", "Verify access to the user\u2019s actual service before marking resolved."]}, "Slow computer": {"sections": ["system", "storage", "processes", "startup", "events"], "steps": ["Reproduce and record when the slowdown occurs.", "Review memory, free storage and top working sets. CPU seconds are cumulative, not instantaneous utilization.", "Review startup entries and events; do not disable services blindly.", "Agree any cleanup or restart with the user.", "Repeat the same workload and compare before/after evidence."]}, "Printer problem": {"sections": ["printers", "services", "events"], "steps": ["Confirm affected printer, application, port and whether all users are affected.", "Inspect offline flag, queue and Print Spooler.", "Check power, cable or network port and driver compatibility.", "Restart spooler only with approval; this can interrupt printing.", "Submit a test page and verify output from the user\u2019s application."]}, "Windows Update": {"sections": ["updates", "services", "events", "storage"], "steps": ["Check available space and reboot indications.", "Review Windows Update and BITS service states; trigger-start services may normally be stopped.", "Review Settings update history; hotfix inventory is not complete update history.", "Use DISMCheck for triage or SFC when repair is justified.", "Reboot if agreed, retry the update and capture its actual outcome."]}, "USB / driver error": {"sections": ["hardware", "drivers", "events"], "steps": ["Record the exact device and Device Manager error code.", "Test known-good cable and another port, one variable at a time.", "Check manufacturer drivers and related events.", "Do not assume code 43 means a software fault.", "Reconnect and rescan; verify the intended device operation."]}, "Security triage": {"sections": ["defender", "firewall", "bitlocker", "accounts", "connections", "startup"], "steps": ["Confirm effective antivirus and organizational policy.", "Review unexpected administrator memberships and established connections in context.", "This release does not identify malware or establish compromise.", "Preserve evidence and escalate to the security team if suspicious.", "Avoid killing processes or deleting evidence as an automatic fix."]}}}</script><script>
'use strict';
const payload=JSON.parse(document.getElementById('payload').textContent), scan=payload.scan, findings=payload.findings, workflows=payload.workflows;
const sections=scan.sections||{}, $=id=>document.getElementById(id);
const esc=v=>String(v??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const data=(name,fallback={})=>sections[name]?.status==='ok'?(sections[name].data??fallback):fallback;
const arr=v=>Array.isArray(v)?v:(v==null?[]:[v]);
const pages={overview:'Device overview',findings:'Findings',evidence:'Evidence explorer',troubleshoot:'Guided troubleshooting',ticket:'Ticket workspace',repairs:'Repair reference'};
Object.entries(pages).forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.className=id==='overview'?'active':'';b.onclick=()=>{document.querySelectorAll('.view').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('nav button').forEach(e=>e.classList.toggle('active',e===b));$('title').textContent=name};$('nav').appendChild(b)});
const sys=data('system'), disks=arr(data('storage',[])), probe=data('connectivity');
$('subtitle').textContent=(sys.hostname||'Identity omitted')+' · '+(sys.os||'OS unavailable')+' · '+scan.generated_at;
$('banner').textContent=scan.mode==='demo'?'DEMO DATA — a fictional endpoint. No scan or repair has run on this device.':`LIVE SNAPSHOT · ${scan.privacy==='share'?'Share profile: identifying sections omitted':'Local profile: contains sensitive endpoint evidence'} · ${scan.elevated?'Elevated collection':'Standard user collection; some checks may be unavailable'}`;
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('json').onclick=()=>download(JSON.stringify(scan,null,2),'NodeNix-scan.json','application/json');
const critical=findings.filter(f=>f.severity==='critical').length, warnings=findings.filter(f=>f.severity==='warning').length;
function card(label,value,unit,percent){return `<div class="card"><div class="small">${esc(label)}</div><div class="number">${esc(value)} <span class="unit">${esc(unit)}</span></div>${percent!=null?`<div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,Number(percent)||0))}%"></div></div>`:''}</div>`}
function finding(f){return `<div class="finding"><span class="badge ${esc(f.severity)}">${esc(f.severity)}</span> <span class="small">${esc(f.category)}</span><h3>${esc(f.title)}</h3><p class="muted">${esc(f.evidence)}</p><p>${esc(f.next_step)}</p></div>`}
function state(value){return value===true?'<span class="good">Pass</span>':value===false?'<span style="color:var(--warn)">Needs review</span>':'<span class="muted">Not tested / unknown</span>'}
$('overview').innerHTML=`<div class="cards">${card('Critical findings',critical,'open')}${card('Review findings',warnings,'warnings')}${card('Memory used',sys.memory_percent??'—','%',sys.memory_percent)}${card('Uptime',sys.uptime_days??'—','days')}</div><div class="split"><div class="box"><h2>What needs attention</h2>${findings.slice(0,5).map(finding).join('')||'<div class="empty">No rules triggered. This does not prove the device is healthy; review collection coverage.</div>'}</div><div><div class="box"><h2>Connectivity probes</h2>${['gateway','dns','https'].map(k=>`<div class="statrow"><span>${esc(k.toUpperCase())}</span>${state(probe[k])}</div>`).join('')}<p class="small">Tests are opt-in. A blocked ping is inconclusive.</p></div><div class="box" style="margin-top:20px"><h2>Storage snapshot</h2>${disks.map(d=>`<div class="statrow"><strong>${esc(d.drive)}</strong><span>${esc(d.free_gb)} GB free · ${esc(d.used_percent)}% used</span></div>`).join('')||'<p class="muted">Unavailable</p>'}</div><div class="box" style="margin-top:20px"><h2>Collection coverage</h2><div class="number">${Object.values(sections).filter(s=>s.status==='ok').length}<span class="unit"> / ${Object.keys(sections).length} sections</span></div><p class="small">Unavailable and omitted sections are visible in Evidence.</p></div></div></div>`;
$('findings').innerHTML='<div class="toolbar"><input id="search" aria-label="Search findings" placeholder="Search evidence or category"><select id="severity" aria-label="Filter severity"><option value="all">All severities</option><option>critical</option><option>warning</option><option>info</option></select></div><div class="box" id="findinglist"></div>';
function filter(){const q=$('search').value.toLowerCase(),s=$('severity').value;const matches=findings.filter(f=>(s==='all'||s===f.severity)&&JSON.stringify(f).toLowerCase().includes(q));$('findinglist').innerHTML=matches.map(finding).join('')||'<div class="empty">No matching findings.</div>'} $('search').oninput=filter;$('severity').onchange=filter;filter();
$('evidence').innerHTML='<div class="toolbar"><select id="section" aria-label="Evidence section"></select></div><div class="box"><h2 id="sectiontitle"></h2><p class="muted" id="sectionstatus"></p><pre id="sectiondata"></pre></div>';
Object.keys(sections).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k.replaceAll('_',' ');$('section').appendChild(o)});
function showEvidence(){const k=$('section').value,s=sections[k]||{};$('sectiontitle').textContent=k.replaceAll('_',' ');$('sectionstatus').textContent=`Status: ${s.status||'missing'}${s.error?' · '+s.error:''}${s.reason?' · '+s.reason:''}`;$('sectiondata').textContent=JSON.stringify(s.data,null,2)}$('section').onchange=showEvidence;showEvidence();
$('troubleshoot').innerHTML='<div class="toolbar"><select id="workflow" aria-label="Select issue"></select></div><div class="grid"><div class="box"><h2>Investigation procedure</h2><ol id="steps"></ol></div><div class="box"><h2>Relevant evidence</h2><div id="relevant"></div><p class="small">Recommendations require technician judgment. A command completing does not resolve an incident.</p></div></div>';
Object.keys(workflows).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k;$('workflow').appendChild(o)});
function showWorkflow(){const w=workflows[$('workflow').value];$('steps').innerHTML=w.steps.map(s=>`<li>${esc(s)}</li>`).join('');$('relevant').innerHTML=w.sections.map(s=>`<div class="statrow"><span>${esc(s)}</span><span class="badge">${esc(sections[s]?.status||'missing')}</span></div>`).join('');const matched=findings.filter(f=>({Network:'No Internet',System:'Slow computer',Storage:'Slow computer',Printers:'Printer problem',Windows:'Windows Update',Hardware:'USB / driver error',Security:'Security triage'}[f.category])===$('workflow').value);$('relevant').innerHTML+=matched.map(finding).join('')} $('workflow').onchange=showWorkflow;showWorkflow();
$('ticket').innerHTML=`<div class="grid"><div class="box"><h2>Document the investigation</h2><p class="small">Edits stay in this page until downloaded. No browser storage or ITSM connection.</p><label for="issue">Reported issue</label><textarea id="issue" placeholder="What did the user report?"></textarea><label for="cause">Assessment / suspected cause</label><textarea id="cause" placeholder="Record evidence, uncertainty and confirmed cause if established."></textarea><label for="action">Action actually taken</label><textarea id="action" placeholder="Do not record suggested actions as completed."></textarea><label for="verify">Verification and user confirmation</label><textarea id="verify" placeholder="Record the fresh test result."></textarea><label for="status">Status</label><select id="status"><option>Investigating</option><option>Awaiting user</option><option>Escalated</option><option>Resolved</option></select><div class="toolbar"><button class="btn primary" id="ticketexport">Download ticket notes</button><button class="btn" id="kbexport">Download KB draft</button></div><div id="ticketerror" role="status" class="muted"></div></div><div class="box"><h2>Ticket preview</h2><pre id="ticketpreview"></pre></div></div>`;
function ticketText(){return `NodeNix investigation\nScan: ${scan.generated_at}\nDevice: ${sys.hostname||'omitted'}\nData mode: ${scan.mode}\n\nReported issue:\n${$('issue').value||'Not recorded'}\n\nEvidence:\n${findings.map(f=>'- '+f.title+': '+f.evidence).join('\n')||'No triage rules triggered.'}\n\nAssessment:\n${$('cause').value||'Not established'}\n\nAction taken:\n${$('action').value||'None recorded'}\n\nVerification:\n${$('verify').value||'Not verified'}\n\nStatus: ${$('status').value}\n`}
function preview(){ $('ticketpreview').textContent=ticketText()}['issue','cause','action','verify','status'].forEach(k=>$(k).oninput=preview);preview();
$('ticketexport').onclick=()=>{if($('status').value==='Resolved'&&!$('verify').value.trim()){ $('ticketerror').textContent='Record verification before exporting a resolved ticket.';return}$('ticketerror').textContent='';download(ticketText(),'NodeNix-ticket.txt','text/plain')};
$('kbexport').onclick=()=>download(`# KB draft: ${$('issue').value||'Untitled investigation'}\n\n## Symptoms\n${$('issue').value}\n\n## Assessment\n${$('cause').value}\n\n## Action taken\n${$('action').value}\n\n## Verification\n${$('verify').value}\n\n## Escalation criteria\nDocument when to involve L2 or Security.\n\nDraft — review and remove identifiers before publication.\n`,'NodeNix-KB-draft.md','text/markdown');
$('repairs').innerHTML=`<div class="box" style="margin-top:24px"><h2>Explicit, local repair commands</h2><p class="muted">This HTML report cannot execute PowerShell. Run from the extracted project folder in an Administrator PowerShell window. Preview with -WhatIf; execution prompts for confirmation.</p>${[['FlushDNS','Clears resolver cache. It does not change DNS settings.'],['RestartSpooler','Restarts the printing service; may interrupt active jobs. Does not delete the queue.'],['SFC','May repair protected Windows files; can take several minutes.'],['DISMCheck','Checks the recorded component-store health state; does not perform a full scan or repair.']].map(([a,d])=>`<div class="finding"><h3>${esc(a)}</h3><p>${esc(d)}</p><pre>.\\collector\\Repair-NodeNix.ps1 -Action ${a} -WhatIf\n.\\collector\\Repair-NodeNix.ps1 -Action ${a}</pre></div>`).join('')}<h3>Verify afterwards</h3><pre>py -3 nodenix.py scan --connectivity</pre><p class="small">Reproduce the original issue and confirm with the user. No repair is launched by a diagnostic scan.</p></div>`;
</script></body></html>
